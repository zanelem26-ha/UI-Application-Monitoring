<div class="dashboard">

  <div class="dashboard-header">
    <h1>Application Monitoring Dashboard</h1>
    <p>Overview of applications, incidents and system activity</p>
  </div>

  <div class="dashboard-cards">

    <div class="dashboard-card">
      <h2>Applications</h2>
      <p>{{ applications.length }}</p>
    </div>

    <div class="dashboard-card">
      <h2>Open Incidents</h2>
      <p>{{ openIncidents.length }}</p>
    </div>

    <div class="dashboard-card">
      <h2>Critical Incidents</h2>
      <p>{{ criticalIncidents.length }}</p>
    </div>

    <div class="dashboard-card">
      <h2>Incident Comments</h2>
      <p>{{ incidentComments.length }}</p>
    </div>

  </div>

</div>
